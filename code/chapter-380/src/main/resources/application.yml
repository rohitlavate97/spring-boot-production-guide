server:
  port: 8080

spring:
  application:
    name: observability-service

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      region: us-east-1
      environment: production
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1000ms

finflow:
  observability:
    slo:
      availability-target: 99.9
      p99-latency-threshold-ms: 200.0
      error-rate-threshold-percent: 1.0
