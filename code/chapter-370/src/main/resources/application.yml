server:
  port: 8080

spring:
  application:
    name: distributed-transactions-service
  datasource:
    url: jdbc:h2:mem:finflow_saga_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

finflow:
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
