spring:
  application:
    name: chapter-060-auto-configuration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none

finflow:
  payment:
    gateway:
      enabled: true
      base-url: https://api.payment-gateway.example.com
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
      max-retries: 3
