server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: module-25-database-migrations-flyway-locks-zero-downtime
  datasource:
    url: jdbc:h2:mem:finflow_migrations_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true # Critical safety rule: disables flywayClean in production!
    out-of-order: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
