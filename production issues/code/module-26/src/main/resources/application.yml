server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: module-26-deployment-failures-rolling-blue-green-canary

finflow:
  deployment:
    baseline-version: "v1.0.0"
    canary-version: "v2.0.0"
    canary-weight-percent: 10
    max-allowed-error-rate-percent: 1.0
    max-allowed-p99-latency-ms: 250

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
