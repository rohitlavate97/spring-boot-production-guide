# Kubernetes Blue-Green Deployment Service Selector
apiVersion: v1
kind: Service
metadata:
  name: finflow-clearing-active-service
  namespace: production
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: finflow-clearing
    # Switch active traffic instantly from 'blue' to 'green' with zero downtime
    deployment-color: blue
