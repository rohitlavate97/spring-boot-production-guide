server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: module-27-distributed-microservice-failure-sagas
  datasource:
    url: jdbc:h2:mem:finflow_sagas_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
