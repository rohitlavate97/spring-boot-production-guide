# ==============================================================================
# ❌ ANTI-PATTERN NGINX CONFIGURATION: 4 Fatal Reverse Proxy Pitfalls
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # ❌ Pitfall 1: Keepalive Timeout Mismatch
    # Nginx keepalive (75s) > Tomcat keepalive (20s).
    # Nginx attempts to reuse closing sockets, producing 502 Bad Gateway / Connection Reset!
    keepalive_timeout 75s;

    upstream broken_upstream {
        server 10.0.1.10:8080;
        # ❌ Pitfall 2: Missing upstream keepalive directive (Opens new TCP handshake per request!)
    }

    server {
        listen 80;
        server_name api.finflow.com;

        # ❌ Pitfall 3: Massive 60s timeout without downstream client bounds (Causes thread pool starvation)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # ❌ Pitfall 4: Undersized Buffers (Forces large responses to disk /var/cache/nginx/proxy_temp)
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;

        location / {
            proxy_pass http://broken_upstream;

            # ❌ Missing proxy_http_version 1.1 and proxy_set_header Connection "" (Defaults to HTTP/1.0 Close!)
            # ❌ Missing X-Forwarded-Proto (Causes OAuth2 redirect URL mismatch / HTTP instead of HTTPS)
        }
    }
}
