# ==============================================================================
# Production-Hardened Nginx Reverse Proxy Configuration for Spring Boot
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # Client Keep-Alive to Nginx (Edge Timeout: 65s)
    # Downstream Tomcat MUST have server.tomcat.keep-alive-timeout >= 70s!
    # --------------------------------------------------------------------------
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # Upstream Spring Boot Cluster with Connection Pooling
    upstream spring_boot_cluster {
        server 10.0.1.10:8080 max_fails=3 fail_timeout=10s;
        server 10.0.1.11:8080 max_fails=3 fail_timeout=10s;

        # Keepalive connection pool to upstream Spring Boot instances
        keepalive 64;
    }

    server {
        listen 80;
        server_name api.finflow.com;

        # ----------------------------------------------------------------------
        # Granular Proxy Timeout Hierarchy:
        # Connect: 2s | Read: 10s | Send: 10s
        # ----------------------------------------------------------------------
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # ----------------------------------------------------------------------
        # Proxy Buffer Tuning (Prevents 502 & Disk I/O Bottlenecks on Large Payloads)
        # ----------------------------------------------------------------------
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        proxy_max_temp_file_size 0; # Disable writing response buffers to disk

        location / {
            proxy_pass http://spring_boot_cluster;

            # Mandatory for HTTP/1.1 Persistent Keep-Alive Connections to Spring Boot
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forwarded Header Propagation (Matched with server.forward-headers-strategy=framework)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Safe Retries for Idempotent Failures
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
